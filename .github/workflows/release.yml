name: Release

# On every push to main: run CI, build and push the image to GHCR, then deploy
# to the home server behind a manual approval (the `production` environment).
#
# The deploy job connects to the home server through the VPS jump host because
# the home ISP uses CGNAT (no inbound). Secrets come from the `production`
# environment, so they are only released to the job after it is approved:
#   DEPLOY_SSH_KEY      private key authorized on both the VPS and the home server
#   DEPLOY_KNOWN_HOSTS  host keys of 116.212.74.54 (jump) and 10.8.0.2 (target)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a release mid-deploy.
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/faarihihsan/kilo-be

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ github.sha }}

  deploy:
    name: Deploy to home server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual approval gate. Environment secrets are only exposed after approval.
    environment:
      name: production
      url: https://kilo.faarihsan.com
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync compose file to the server
        run: |
          # Pipe over the ssh exec channel; scp/SFTP mode is not available on
          # the home sshd, but plain ssh (used below) works.
          ssh -o BatchMode=yes \
              -o ProxyJump=ihsan@116.212.74.54 \
              -i ~/.ssh/deploy_key \
              ihsan@10.8.0.2 'cat > ~/apps/workout-tracker/compose.yml' \
              < deploy/compose.yml

      - name: Deploy over the VPS jump host
        run: |
          ssh -o BatchMode=yes \
              -o ProxyJump=ihsan@116.212.74.54 \
              -i ~/.ssh/deploy_key \
              ihsan@10.8.0.2 "TAG='${{ github.sha }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/apps/workout-tracker

          # Safety: dump the database before an image (which may migrate) lands.
          if docker compose ps --status running --services | grep -qx postgres; then
            ts="$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p backups
            docker compose exec -T postgres pg_dump -U workout -Fc workout \
              > "backups/pre-deploy-$ts.dump"
            echo "pre-deploy dump: backups/pre-deploy-$ts.dump"
            find backups -maxdepth 1 -type f -name 'pre-deploy-*.dump' -mtime +14 -delete
          fi

          docker compose pull
          docker compose run --rm migrate
          docker compose up -d app

          # Fail the job if the new container never becomes healthy.
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              echo "healthz OK after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "healthz did not come up" >&2
          docker compose logs --tail 100 app >&2 || true
          exit 1
          REMOTE
