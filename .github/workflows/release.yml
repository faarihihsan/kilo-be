name: Release

# On every push to main: run CI, build and push the image to GHCR, then deploy
# to the home server behind a manual approval (the `production` environment).
#
# The deploy job connects to the home server through the VPS jump host because
# the home ISP uses CGNAT (no inbound). The secret comes from the `production`
# environment, so it is only released to the job after it is approved:
#   DEPLOY_SSH_KEY      private key authorized on both the VPS and the home server
# The servers' (public) host keys are pinned in deploy/known_hosts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a release mid-deploy.
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/faarihihsan/kilo-be

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ github.sha }}

  deploy:
    name: Deploy to home server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Manual approval gate. Environment secrets are only exposed after approval.
    environment:
      name: production
      url: https://kilo.faarihsan.com
    steps:
      # Each job gets a fresh runner: without this, deploy/compose.yml,
      # deploy/deploy.sh and deploy/known_hosts do not exist here.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned (public) host keys for the VPS and the home server. Nothing
          # is scanned at deploy time, so a missing or changed key fails loudly.
          install -m 600 deploy/known_hosts ~/.ssh/known_hosts
          # An ssh config makes the JUMP host use the deploy key too: -i applies
          # only to the target, so without this the ProxyJump connection tries
          # the runner's (nonexistent) default keys and fails with exit 255.
          cat > ~/.ssh/config <<'EOF'
          Host vps
              HostName 116.212.74.54
              User ihsan
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              StrictHostKeyChecking yes

          Host home
              HostName 10.8.0.2
              User ihsan
              ProxyJump vps
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: SSH preflight
        run: |
          ssh -o BatchMode=yes home 'echo "ssh preflight OK: $(hostname)"'

      - name: Sync deploy files to the server
        run: |
          # Pipe over the ssh exec channel; scp/SFTP mode is not available on
          # the home sshd, but plain ssh (used below) works.
          ssh -o BatchMode=yes home 'cat > ~/apps/workout-tracker/compose.yml' < deploy/compose.yml
          ssh -o BatchMode=yes home 'cat > ~/apps/workout-tracker/deploy.sh' < deploy/deploy.sh

      - name: Deploy over the VPS jump host
        run: |
          # deploy.sh is a real file on the server, so docker commands that read
          # stdin cannot swallow the script (the reason this used to fail).
          ssh -o BatchMode=yes home "cd ~/apps/workout-tracker && TAG='${{ github.sha }}' bash deploy.sh"
