# Home server nginx site for workout-tracker.
# Install as /etc/nginx/sites-available/kilo, symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public TLS is terminated on the VPS; this block sees the tunneled HTTP request
# (Host: kilo.faarihsan.com). The Go app serves only the JSON API; nginx serves
# /media/* straight from disk so image requests never reach the app.
server {
    listen 80;
    server_name kilo.faarihsan.com;

    # Exercise images are capped at 2 MiB in the app; 4m leaves room for the
    # multipart envelope. (The VPS proxy sends body-size 0 and forwards here.)
    client_max_body_size 4m;

    # GET /media/exercises/{id}/{hash}.{ext} -> <media>/exercises/...
    # The file name contains the content hash, so a cached copy is never stale.
    # This path MUST equal MEDIA_DIR in .env (host: ~/apps/workout-tracker/media).
    location /media/ {
        alias /home/ihsan/apps/workout-tracker/media/;
        autoindex off;
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The VPS proxy set these; forward them so the app can rate-limit by the
        # real client IP (it trusts X-Forwarded-For only from 127.0.0.1).
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
