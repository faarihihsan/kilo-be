# PostgreSQL settings for the 2 vCPU / 2 GB RAM VPS (docs/implementation-plan.md
# section 8). Starting points, not gospel: adjust after measuring.
#
# Install on Debian/Ubuntu (conf.d is included by the default postgresql.conf),
# where <ver> is the installed major version, then restart:
#   install -o postgres -g postgres -m 644 postgresql-tuning.conf \
#       /etc/postgresql/<ver>/main/conf.d/workout-tracker.conf
#   systemctl restart postgresql
# A restart is required: shared_buffers, max_connections and listen_addresses
# do not apply on reload.
#
# Memory budget: PostgreSQL ~ 256 MB shared + a few MB per connection, the Go
# server 100-200 MB (plus up to 128 MB while hashing passwords), Caddy ~50 MB,
# the rest is OS page cache.

# Only local connections. Never expose 5432; the firewall blocks it as well.
listen_addresses = 'localhost'

# The app pool uses at most DB_MAX_CONNS (10); the rest is headroom for
# migrations, psql sessions and the backup's pg_dump.
max_connections = 20

# About 12% of RAM.
shared_buffers = 256MB

# Planner hint for how much the OS is likely to cache (about half of RAM). It
# reserves nothing.
effective_cache_size = 1GB

# Per sort/hash node per query. 20 connections x a few nodes x 4 MB stays small.
work_mem = 4MB
