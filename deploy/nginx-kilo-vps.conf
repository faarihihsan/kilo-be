# VPS nginx site for workout-tracker (public entry point).
# Install as /etc/nginx/sites-available/kilo, symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kilo.faarihsan.com
#
# certbot rewrites this file to add the :443 TLS block and the http->https
# redirect, and certbot.timer renews the certificate automatically afterwards.
# The home-proxy snippet forwards everything over the WireGuard tunnel to home.
server {
    listen 80;
    listen [::]:80;
    server_name kilo.faarihsan.com;

    include snippets/home-proxy.conf;
}
